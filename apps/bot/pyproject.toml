[project]
name = "enigma-bot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.15.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "qrcode[pil]>=8.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bot*"]
