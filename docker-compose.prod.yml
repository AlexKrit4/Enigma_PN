# Single VPS production: Enigma_PN + host Marzban (Reality on :443).
# Nginx binds host :80 only — :443 is reserved for Xray Reality.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # Marzban on host 127.0.0.1:8000 is proxied to :8001 for Docker bridge access
      MARZBAN_URL: ${MARZBAN_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MARZBAN_URL: ${MARZBAN_URL:-http://host.docker.internal:8001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.workers.settings.WorkerSettings

  bot:
    build:
      context: ./apps/bot
    restart: unless-stopped
    env_file: .env
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.bigwinzone.ru}
        NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME:-Enigma_PN}
        NEXT_PUBLIC_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-enigmapnbot}
        NEXT_PUBLIC_DOMAIN: ${DOMAIN:-bigwinzone.ru}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: https://${API_DOMAIN:-api.bigwinzone.ru}
      NEXT_PUBLIC_BRAND_NAME: ${BRAND_NAME:-Enigma_PN}
      NEXT_PUBLIC_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-enigmapnbot}
      NEXT_PUBLIC_DOMAIN: ${DOMAIN:-bigwinzone.ru}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Public :443 = Xray Reality. Site/API TLS is published on host :8443.
      - "8443:443"
      # Web admin panel: https://bigwinzone.ru:1110/admin
      - "1110:1110"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/nginx/certs:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - api
      - web

volumes:
  postgres_data:
