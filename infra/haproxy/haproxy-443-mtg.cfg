# HAProxy on :443 — TCP SNI multiplex (site + MTProto Fake-TLS)
# Install: cp infra/haproxy/haproxy-443-mtg.cfg /etc/haproxy/haproxy.cfg && systemctl reload haproxy
#
# - SNI www.google.com  → mtg (127.0.0.1:3128)  — domain from MTPROTO Fake-TLS secret
# - everything else     → site TLS nginx (127.0.0.1:8444)

global
    log /dev/log local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  clitcpka
    option  srvtcpka
    timeout connect 10s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h

frontend fe_443
    bind *:443
    bind :::443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    use_backend be_mtg if { req_ssl_sni -i www.google.com }
    default_backend be_web

backend be_mtg
    mode tcp
    server mtg 127.0.0.1:3128 check inter 5s fall 3 rise 2

backend be_web
    mode tcp
    server web 127.0.0.1:8444 check inter 5s fall 3 rise 2
