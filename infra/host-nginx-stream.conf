# Host nginx stream mux for public :443 (install on VPS as /etc/nginx/nginx.conf stream section).
# Site docker nginx must bind 127.0.0.1:8444:443
# MTProto mtg must bind 127.0.0.1:3128
#
# SNI google.com / www.google.com → MTProto
# SNI bigwinzone.ru / api / sub / www → site TLS
# Reality VPN stays on :52250 (not muxed here)

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 4096;
}

http {
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}

stream {
    log_format basic "$remote_addr [$time_local] $protocol $status $bytes_sent $bytes_received $session_time sni=$ssl_preread_server_name";
    access_log /var/log/nginx/stream-access.log basic;
    error_log /var/log/nginx/stream-error.log;

    map $ssl_preread_server_name $backend {
        google.com              mtproto;
        www.google.com          mtproto;
        bigwinzone.ru           web_https;
        www.bigwinzone.ru       web_https;
        api.bigwinzone.ru       web_https;
        sub.bigwinzone.ru       web_https;
        default                 web_https;
    }

    upstream mtproto {
        server 127.0.0.1:3128;
    }

    upstream web_https {
        server 127.0.0.1:8444;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;
        ssl_preread on;
        proxy_pass $backend;
        proxy_timeout 1d;
        proxy_connect_timeout 5s;
    }
}
