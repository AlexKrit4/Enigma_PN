# Temporary config: HTTP only + ACME webroot (used before certs exist)
upstream enigma_api {
    server api:8000;
}

upstream enigma_web {
    server web:3000;
}

server {
    listen 80;
    server_name bigwinzone.ru www.bigwinzone.ru api.bigwinzone.ru sub.bigwinzone.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /webhooks/ {
        proxy_pass http://enigma_api/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://enigma_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://enigma_api/health;
    }

    location /s/ {
        proxy_pass http://enigma_api/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
    }

    location / {
        proxy_pass http://enigma_web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
