upstream enigma_api {
    server api:8000;
}

upstream enigma_web {
    server web:3000;
}

# HTTP :80 — ACME + redirect to HTTPS on :8443
# (public :443 is reserved for VLESS Reality)
server {
    listen 80;
    server_name bigwinzone.ru www.bigwinzone.ru api.bigwinzone.ru sub.bigwinzone.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ---------- HTTPS API (:8443 externally) ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.bigwinzone.ru;

    ssl_certificate     /etc/nginx/certs/live/bigwinzone.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/bigwinzone.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    location /webhooks/ {
        proxy_pass http://enigma_api/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://enigma_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health {
        proxy_pass http://enigma_api/health;
    }

    location /docs {
        proxy_pass http://enigma_api/docs;
    }

    location /openapi.json {
        proxy_pass http://enigma_api/openapi.json;
    }

    location /admin/ {
        proxy_pass http://enigma_api/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Bot-Token $http_x_bot_token;
    }

    location / {
        proxy_pass http://enigma_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------- HTTPS subscription proxy ----------
server {
    listen 443 ssl;
    http2 on;
    server_name sub.bigwinzone.ru;

    ssl_certificate     /etc/nginx/certs/live/bigwinzone.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/bigwinzone.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /s/ {
        proxy_pass http://enigma_api/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent $http_user_agent;
    }

    location /health {
        proxy_pass http://enigma_api/health;
    }

    location / {
        return 404;
    }
}

# ---------- HTTPS site ----------
server {
    listen 443 ssl;
    http2 on;
    server_name bigwinzone.ru www.bigwinzone.ru;

    ssl_certificate     /etc/nginx/certs/live/bigwinzone.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/bigwinzone.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://enigma_web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
