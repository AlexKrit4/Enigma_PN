# HTTP only on :80 — host :443 is used by Marzban Xray Reality.
# For HTTPS later: Cloudflare proxy to :80, or move Reality off 443.

upstream enigma_api {
    server api:8000;
}

upstream enigma_web {
    server web:3000;
}

# API + YooMoney webhooks + health
server {
    listen 80;
    server_name api.bigwinzone.ru;

    client_max_body_size 5m;

    location /webhooks/ {
        proxy_pass http://enigma_api/webhooks/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://enigma_api/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://enigma_api/health;
    }

    location /docs {
        proxy_pass http://enigma_api/docs;
    }

    location /openapi.json {
        proxy_pass http://enigma_api/openapi.json;
    }

    location / {
        proxy_pass http://enigma_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Happ subscription proxy
server {
    listen 80;
    server_name sub.bigwinzone.ru;

    location /s/ {
        proxy_pass http://enigma_api/s/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header User-Agent $http_user_agent;
    }

    location /health {
        proxy_pass http://enigma_api/health;
    }

    location / {
        return 404;
    }
}

# Marketing site + dashboard
server {
    listen 80;
    server_name bigwinzone.ru www.bigwinzone.ru;

    location / {
        proxy_pass http://enigma_web/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
