# Docker embedded DNS — re-resolve upstreams so API IP changes don't cause 502.
resolver 127.0.0.11 valid=10s ipv6=off;

# HTTP :80 — ACME + redirect to HTTPS
server {
    listen 80;
    server_name bigwinzone.ru www.bigwinzone.ru api.bigwinzone.ru sub.bigwinzone.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS API ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.bigwinzone.ru;

    ssl_certificate     /etc/nginx/certs/live/bigwinzone.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/bigwinzone.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    set $api_upstream http://api:8000;

    location /webhooks/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health {
        proxy_pass $api_upstream/health;
    }

    location /docs {
        proxy_pass $api_upstream/docs;
    }

    location /openapi.json {
        proxy_pass $api_upstream/openapi.json;
    }

    location /admin/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Bot-Token $http_x_bot_token;
    }

    location / {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------- HTTPS subscription proxy ----------
server {
    listen 443 ssl;
    http2 on;
    server_name sub.bigwinzone.ru;

    ssl_certificate     /etc/nginx/certs/live/bigwinzone.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/bigwinzone.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set $api_upstream http://api:8000;

    location /s/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header User-Agent $http_user_agent;
    }

    location /add/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health {
        proxy_pass $api_upstream/health;
    }

    location / {
        return 404;
    }
}

# ---------- HTTPS site ----------
server {
    listen 443 ssl;
    http2 on;
    server_name bigwinzone.ru www.bigwinzone.ru;

    ssl_certificate     /etc/nginx/certs/live/bigwinzone.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/bigwinzone.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set $web_upstream http://web:3000;

    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------- Web admin panel :1110 ----------
# https://bigwinzone.ru:1110/admin
server {
    listen 1110 ssl;
    http2 on;
    server_name bigwinzone.ru;

    ssl_certificate     /etc/nginx/certs/live/bigwinzone.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/bigwinzone.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 5m;

    set $web_upstream http://web:3000;
    set $api_upstream http://api:8000;

    # Same-origin API proxy for the admin SPA (Bearer JWT).
    location /admin-api/ {
        rewrite ^/admin-api/(.*)$ /admin/$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

