# 3proxy SOCKS5 with strong auth — users loaded from /cfg/passwd
# passwd lines: username:CL:password
maxconn 2000
nserver 1.1.1.1
nserver 8.8.8.8
nscache 65536
timeouts 1 5 30 60 180 1800 15 60
daemon
log /dev/stdout
logformat "- %t %N.%p %E %U %C:%c %R:%r %O %I %h %T"
auth strong
users $/cfg/passwd
allow *
socks -p40080
# reload when passwd stamp changes (optional; host watcher also sends SIGHUP)
monitor /cfg/passwd.reload
