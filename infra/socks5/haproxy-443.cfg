# Install as /etc/haproxy/haproxy.cfg on the VPS.
# Byte 0x05 (SOCKS5) → sing-box 127.0.0.1:40080
# Everything else (TLS/site) → docker nginx 127.0.0.1:8444

global
    log /dev/log local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  clitcpka
    option  srvtcpka
    timeout connect 10s
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h

frontend fe_443
    bind *:443
    bind :::443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.payload(0,1) -m found }
    tcp-request content accept if WAIT_END
    acl is_socks req.payload(0,1) -m bin 05
    use_backend be_socks if is_socks
    default_backend be_web

backend be_socks
    mode tcp
    server socks 127.0.0.1:40080

backend be_web
    mode tcp
    server web 127.0.0.1:8444 check inter 5s fall 3 rise 2
